appId: com.devplatform.desktop
productName: AI-Dev-Platform
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
afterPack: scripts/after-pack.js
directories:
  output: dist-package
  buildResources: build
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../bin
    to: bin
    filter:
      - platform*
  - from: ../web/dist
    to: web
linux:
  icon: build/icon.png
  target:
    - AppImage
    - tar.gz
  category: Development
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
    - zip
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
