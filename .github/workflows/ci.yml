name: CI

on:
  push:
  pull_request:

jobs:
  # Backend: vet plus the full unit suite on both platforms. The Windows
  # unit run is required: it is the first execution of the windows-tagged
  # tests (Task 4.7 could only cross-compile them without a machine).
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Frontend unit tests, lint, typecheck and production build (React).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
        working-directory: web-next
      - run: npm run typecheck
        working-directory: web-next
      - run: npm run lint
        working-directory: web-next
      - run: npm run test:run
        working-directory: web-next
      - run: npm run build
        working-directory: web-next

  # The Vue app stays buildable as the rollback path.
  web-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web

  # End-to-end against the real Go server and pi fixture. The harness builds
  # the server, starts Vite, and runs Playwright; it is blocking after cutover.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
        working-directory: web-next
      - run: npx playwright install --with-deps chromium
        working-directory: web-next
      - run: npm run test:e2e
        working-directory: web-next
