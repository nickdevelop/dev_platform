name: CI

on:
  push:
  pull_request:

jobs:
  # Backend: vet plus the full unit suite on both platforms. The Windows
  # unit run is required: it is the first execution of the windows-tagged
  # tests (Task 4.7 could only cross-compile them without a machine).
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Frontend unit tests and typecheck run on Linux only.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web

  # End-to-end on both platforms. Informational until the 7 pre-existing
  # Linux failures (unrelated to this plan; see the plan's Task 5.2 notes)
  # are fixed: a red e2e does not block merges.
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: web
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
