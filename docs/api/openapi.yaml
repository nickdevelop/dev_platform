openapi: 3.1.0
info:
  title: AI Development Platform API
  description: >-
    Single-user local platform for managing AI development projects.
    All API routes are same-origin under /api.
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      description: Reports service liveness.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/session:
    get:
      summary: Current session
      description: >-
        Reports whether the caller holds a valid session and returns the CSRF
        token to echo in the X-CSRF-Token header on mutating requests. Always
        succeeds, even when unauthenticated.
      operationId: getSession
      responses:
        '200':
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Log in with the shared password
      description: >-
        Verifies the platform password and issues an expiring, HttpOnly,
        SameSite=Strict session cookie. Repeated failures are throttled per
        client. Requires a valid CSRF token.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '429':
          description: Too many failed attempts within the throttle window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      summary: Log out
      description: >-
        Invalidates the current session and clears the session cookie.
        Requires an authenticated session and a valid CSRF token.
      operationId: logout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/roots:
    get:
      summary: List authorized workspace roots
      description: >-
        Returns the workspace roots registered by the operator. Project
        operations are restricted to these roots.
      operationId: listWorkspaceRoots
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered workspace roots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRootList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Register a workspace root
      description: >-
        Registers an existing directory as an authorized workspace root. The
        canonical (symlink-resolved) directory path is stored; paths that do
        not exist or are not directories are refused.
      operationId: addWorkspaceRoot
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceRootRequest'
      responses:
        '201':
          description: Workspace root registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoot'
        '400':
          description: Malformed body or the path is not an existing directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The path is already registered as a workspace root.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/roots/{id}:
    delete:
      summary: Remove a workspace root
      description: >-
        Unregisters a workspace root by id. The directory on disk is never
        touched.
      operationId: removeWorkspaceRoot
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the workspace root to remove.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Workspace root removed.
        '400':
          description: Malformed root id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No workspace root with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the platform_csrf cookie value.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Missing or mismatched CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
      additionalProperties: false
    WorkspaceRoot:
      type: object
      required:
        - id
        - path
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
          description: Canonical absolute directory path of the root.
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkspaceRootList:
      type: object
      required:
        - roots
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceRoot'
      additionalProperties: false
    AddWorkspaceRootRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute path of an existing directory to authorize.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
