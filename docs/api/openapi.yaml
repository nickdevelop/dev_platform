openapi: 3.1.0
info:
  title: AI Development Platform API
  description: >-
    Single-user local platform for managing AI development projects.
    All API routes are same-origin under /api.
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      description: Reports service liveness.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
