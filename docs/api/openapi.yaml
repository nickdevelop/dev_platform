        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session re-attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The instance is not running or continue is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to continue the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/messages:
    post:
      summary: Send a message to a session
      description: >-
        Delivers one user turn to the session's native session. Replies, tool
        activity and errors arrive on the session event stream. A model may only
        be overridden when the backend declares modelSelection.
      operationId: sendProjectSessionMessage
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentSessionMessageRequest'
      responses:
        '202':
          description: Message accepted; output arrives on the event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed body or empty message text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
