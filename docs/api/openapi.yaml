  /projects/{id}/sessions/{sessionId}/raw-events:
    get:
      summary: Proxy the shared sidecar's raw SSE bytes
      description: >-
        Proxies this session backend's raw event-stream bytes untouched (opencode v2's GET /api/event frames today)
        (OpenCodeEvent JSON per data frame) with cookie auth injected
        server-side. The frontend projects events itself; no normalization or
        session filtering happens here. Authorization reuses the
        project-scoped session check.
      operationId: subscribeRawEvents
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A Server-Sent Event stream of raw OpenCodeEvent bytes.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The session's instance is not running or the backend does not declare raw events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
