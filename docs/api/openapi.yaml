          description: Malformed body or reference id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No value stored under the reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a stored credential value
      description: Removes the value stored under the reference.
      operationId: deleteSecret
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Value deleted.
        '400':
          description: Malformed reference id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
