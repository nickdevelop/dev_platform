openapi: 3.1.0
info:
  title: AI Development Platform API
  description: >-
    Single-user local platform for managing AI development projects.
    All API routes are same-origin under /api.
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      description: Reports service liveness.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/session:
    get:
      summary: Current session
      description: >-
        Reports whether the caller holds a valid session and returns the CSRF
        token to echo in the X-CSRF-Token header on mutating requests. Always
        succeeds, even when unauthenticated.
      operationId: getSession
      responses:
        '200':
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Log in with the shared password
      description: >-
        Verifies the platform password and issues an expiring, HttpOnly,
        SameSite=Strict session cookie. Repeated failures are throttled per
        client. Requires a valid CSRF token.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '429':
          description: Too many failed attempts within the throttle window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      summary: Log out
      description: >-
        Invalidates the current session and clears the session cookie.
        Requires an authenticated session and a valid CSRF token.
      operationId: logout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the platform_csrf cookie value.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Missing or mismatched CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
