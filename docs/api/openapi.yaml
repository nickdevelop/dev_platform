        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Session backend does not declare the tool-confirmation capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/permission/{requestId}/reply:
    post:
      summary: Reply to a pending permission request
      description: Decision is once, always or reject (Permission.Reply).
      operationId: replyPermissionRequest
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionRequestReply'
      responses:
        '204':
          description: Reply accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Session backend does not declare the tool-confirmation capability, or the
            request already expired (error permission_expired) after being
            answered, cancelled or timed out server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to reply.
