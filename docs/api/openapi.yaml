    delete:
      summary: Delete a session index entry
      description: >-
        Removes the platform's index entry for the session. The agent-native
        session and its transcript are owned by the agent and are not touched,
        so a later discovery of the same native session indexes it again.
      operationId: deleteProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session to delete.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session index entry removed.
        '400':
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/sessions/{sessionId}/events:
    get:
      summary: Subscribe to a session's normalized event stream
      description: >-
        Streams the session's normalized events as Server-Sent Events
        (text/event-stream). Each data payload is the normalized event envelope;
        the sessionId is the platform session id. A slow or stale client is
        disconnected rather than allowed to stall the instance's stream. The
        stream ends when the instance's event stream ends. Resuming clients
        carry the id of the last applied frame (the Last-Event-ID header on a
        browser reconnect, or the lastEventId query parameter for a manually
        re-opened stream): events the client missed while away are replayed
        from the instance's bounded buffer before the live events; when the
        buffer can no longer vouch for the requested position the stream
        emits a `resync` frame (no id) and the client rebuilds from history.

        Two kinds of event carry session state beyond the transcript. A `turn`
        event (payload phase started or ended; ended carries outcome completed,
        cancelled or failed) is the only source of whether the session is busy.
        A cancelled turn (interrupt or stop) ends as cancelled, never failed; a
        failed turn is followed by an `error` event. An `interaction` event
        (payload kind permission or form; phase requested carries the matching
        permission or form, resolved carries only the id) is the only channel
        for pending confirmations and question forms; the workbench has no
        separate poll or raw-event subscription for them.

        Before the live events, after any replayed frames, the stream emits one
        `interactions` frame (no id, see the 200 response) that replaces the
        client's pending interaction set. It is written only when the backend
        declares tool confirmation.
      operationId: subscribeProjectSessionEvents
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - name: lastEventId
          in: query
          required: false
          description: >-
            Sequence of the last frame the client applied, for a manually
            re-opened stream. The Last-Event-ID header serves the same purpose
            and wins when both are present; a malformed or absent value means
            the client is joining, not resuming.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A Server-Sent Event stream of normalized events.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE frames with id (sequence), event (normalized type) and
                  data (the JSON event envelope), plus two header-less frames:
                  `resync` when a resume position cannot be covered (data `{}`),
                  and `interactions` (data `{"permissions": [...], "forms": [...]}`,
                  the session's pending PermissionRequest and FormInfo lists,
                  possibly empty) as the replacement pending set. Frames of
                  type `interactions` are not part of the sequence and are never
                  replayed; they describe the state at the join point.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The session's instance is not running, or the backend does not
            declare streaming support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/history:
    get:
      summary: Read a session's prior turns
      description: >-
        Returns the session's agent-native prior turns, oldest first, as the
        same normalized event envelope the SSE stream carries, each with
        replayed=true. A tool_result event may carry metadata.files (file, patch, additions, deletions, status) for file edits; the workbench renders the desktop-style +N/-N badge and diff body from it and falls back to plain output text when absent. History stays in the agent's own storage: the platform
        reads it on demand and keeps no copy, so a session whose instance has
        stopped can still be replayed. Requires the backend to declare
        sessionHistory support. At most 5000 of the most recent events are
        returned; truncated reports that older events were left out.
      operationId: readProjectSessionHistory
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
