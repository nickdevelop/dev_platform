openapi: 3.1.0
info:
  title: AI Development Platform API
  description: >-
    Single-user local platform for managing AI development projects.
    All API routes are same-origin under /api.
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      description: Reports service liveness.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/session:
    get:
      summary: Current session
      description: >-
        Reports whether the caller holds a valid session and returns the CSRF
        token to echo in the X-CSRF-Token header on mutating requests. Always
        succeeds, even when unauthenticated.
      operationId: getSession
      responses:
        '200':
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Log in with the shared password
      description: >-
        Verifies the platform password and issues an expiring, HttpOnly,
        SameSite=Strict session cookie. Repeated failures are throttled per
        client. Requires a valid CSRF token.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '429':
          description: Too many failed attempts within the throttle window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      summary: Log out
      description: >-
        Invalidates the current session and clears the session cookie.
        Requires an authenticated session and a valid CSRF token.
      operationId: logout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/roots:
    get:
      summary: List authorized workspace roots
      description: >-
        Returns the workspace roots registered by the operator. Project
        operations are restricted to these roots.
      operationId: listWorkspaceRoots
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered workspace roots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRootList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Register a workspace root
      description: >-
        Registers an existing directory as an authorized workspace root. The
        canonical (symlink-resolved) directory path is stored; paths that do
        not exist or are not directories are refused.
      operationId: addWorkspaceRoot
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceRootRequest'
      responses:
        '201':
          description: Workspace root registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoot'
        '400':
          description: Malformed body or the path is not an existing directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The path is already registered as a workspace root.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspaces/roots/{id}:
    delete:
      summary: Remove a workspace root
      description: >-
        Unregisters a workspace root by id. The directory on disk is never
        touched.
      operationId: removeWorkspaceRoot
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the workspace root to remove.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Workspace root removed.
        '400':
          description: Malformed root id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No workspace root with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects:
    get:
      summary: List projects
      description: >-
        Returns the registered projects with their current names and canonical
        directory paths.
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Register an existing project directory
      description: >-
        Registers an existing directory under an authorized workspace root. The
        canonical path is stored and the project name is derived from the
        directory basename; the directory itself is never modified.
      operationId: registerProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProjectRequest'
      responses:
        '201':
          description: Project registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: >-
            Malformed body, or the path is not an authorized existing
            directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The directory is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/create:
    post:
      summary: Create a project directory
      description: >-
        Creates a new project directory named name under an authorized parent
        directory and records it. The name must be a single safe path element;
        an existing target is never overwritten.
      operationId: createProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, invalid name, or unauthorized parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The target directory already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/move:
    post:
      summary: Move a project directory
      description: >-
        Moves the project directory to an authorized destination path and
        updates the record. Requires the typed confirmation of the project's
        current name; an existing destination is never overwritten.
      operationId: moveProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to move.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveProjectRequest'
      responses:
        '200':
          description: Project moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, bad id, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The source directory is missing, the destination exists, or the
            destination parent is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/rename:
    post:
      summary: Rename a project directory
      description: >-
        Renames the project directory within its current parent and updates the
        record. Requires the typed confirmation of the project's current name;
        an existing target is never overwritten.
      operationId: renameProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to rename.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '200':
          description: Project renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, bad id, invalid name, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The source directory is missing or the target exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/unregister:
    post:
      summary: Unregister a project
      description: >-
        Removes only the platform project record. The directory on disk is never
        touched. This is the non-destructive alternative to delete.
      operationId: unregisterProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to unregister.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Project unregistered.
        '400':
          description: Malformed project id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/delete:
    post:
      summary: Delete a project directory
      description: >-
        Deletes the project directory and its record, preferring the OS trash.
        When the trash is unavailable the request fails with 409 and nothing is
        removed; the caller must re-issue it with permanent=true after an
        explicit confirmation. The typed confirmation of the project's current
        name is always required.
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to delete.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
      responses:
        '204':
          description: Project directory deleted and record removed.
        '400':
          description: Malformed body, bad id, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The directory is missing, or the OS trash is unavailable and the
            request did not explicitly confirm permanent deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/instances:
    get:
      summary: List a project's agent instances
      description: >-
        Returns the agent instances belonging to the project with their current
        lifecycle status, in creation order.
      operationId: listProjectInstances
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project's agent instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Start a project agent instance
      description: >-
        Starts a new instance of the requested backend in the project's working
        directory. A project may run several instances of the same backend; each
        instance has an independent status and stop operation. A failed start is
        recorded as a failed instance but the request itself returns an error
        and never affects other instances.
      operationId: startProjectInstance
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentInstanceRequest'
      responses:
        '201':
          description: Instance started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstance'
        '400':
          description: Malformed body, unknown backend, or unauthorized project path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The project directory is missing or is not a directory, or the
            backend is disabled for the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to start the instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/instances/{instanceId}/stop:
    post:
      summary: Stop a project agent instance
      description: >-
        Stops the named instance. The operation is idempotent and never affects
        another instance of the same project. The instance must belong to the
        project in the path.
      operationId: stopProjectInstance
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: instanceId
          in: path
          required: true
          description: Durable identifier of the instance to stop.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Instance stopped (or already stopped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstance'
        '400':
          description: Malformed path or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such instance in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/instances/{instanceId}/models:
    get:
      summary: List the models an instance's backend offers
      description: >-
        Returns the models the instance's backend currently offers. Requires
        the backend to declare modelSelection; the instance must belong to the
        project. The id uses the same provider/model[#variant] form as the
        message model override.
      operationId: listProjectInstanceModels
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: instanceId
          in: path
          required: true
          description: Durable identifier of the instance to query.
          schema:
            type: string
      responses:
        '200':
          description: The models the backend offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such instance in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The backend does not declare model selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to list models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/agent-backends:
    get:
      summary: List a project's backend enable/disable state
      description: >-
        Returns each registered backend with whether it is enabled for the
        project. A backend with no stored configuration is enabled by default.
      operationId: listProjectBackendConfigs
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project's per-backend enable/disable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendConfigList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/agent-backends/{backend}:
    put:
      summary: Enable or disable a backend for a project
      description: >-
        Upserts the project's enable/disable state for one backend. A disabled
        backend cannot start a new instance in the project; already-running
        instances are unaffected. The pair (project, backend) is unique, so the
        toggle is idempotent.
      operationId: setProjectBackendConfig
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: backend
          in: path
          required: true
          description: Backend id to configure.
          schema:
            type: string
            enum:
              - opencode-v2
              - pi
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentBackendConfigRequest'
      responses:
        '200':
          description: The updated backend configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendConfig'
        '400':
          description: Malformed body or unknown backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /agent-backends:
    get:
      summary: List agent backends and their capabilities
      description: >-
        Returns every registered agent backend with the capabilities it
        declares. The workbench uses this to hide controls the backend does not
        support, so unsupported operations are never presented as available.
      operationId: listAgentBackends
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered backends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /agent-backends/diagnostics:
    get:
      summary: Collect agent backend startup diagnostics
      description: >-
        Runs the pre-flight checks of every registered agent backend:
        executable presence, CLI/API version support against the tested range,
        and (for server backends) API reachability of running instances.
        Messages are actionable and redacted; a backend that fails to report
        is returned as an error report and never prevents the other backends'
        reports.
      operationId: getAgentBackendDiagnostics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: One diagnostics report per registered backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDiagnosticsReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/sessions:
    get:
      summary: List a project's indexed sessions
      description: >-
        Returns the project's session index entries, reconciled against the
        current instance lifecycle so a session whose instance has stopped is
        reported disconnected rather than usable.
      operationId: listProjectSessions
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project's indexed sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a session for a backend
      description: >-
        Starts a new agent-native session for the requested backend and records
        the platform-to-native id mapping. The server reuses the project's most
        recently created running instance of that backend, starting one when
        none is running; a start failure leaves no session behind. The removed
        instanceId field is ignored, so a body without backend is rejected.
      operationId: createProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSessionRequest'
      responses:
        '201':
          description: Session created and indexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed body or missing/invalid backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The backend is disabled for the project, or the request requires a
            capability the backend does not support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            The backend adapter failed to start an instance or to create the
            session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/instances/{instanceId}/sessions:
    get:
      summary: Discover an instance's native sessions
      description: >-
        Lists the agent-native sessions the backend reports for the instance and
        indexes each valid one. Discovery requires the backend to declare
        sessionDiscovery; malformed or misattributed native metadata is ignored.
      operationId: discoverProjectInstanceSessions
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: instanceId
          in: path
          required: true
          description: Durable identifier of the instance to query.
          schema:
            type: string
      responses:
        '200':
          description: The instance's discovered, indexed sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such instance in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The instance is not running or does not support discovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to list sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/continue:
    post:
      summary: Continue an indexed session
      description: >-
        Re-attaches to the session's agent-native session so later messages
        extend it. Refused with a clear error when the instance is not running
        or the backend does not declare sessionContinue.
      operationId: continueProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session re-attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The instance is not running or continue is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to continue the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/messages:
    post:
      summary: Send a message to a session
      description: >-
        Delivers one user turn to the session's native session. Replies, tool
        activity and errors arrive on the session event stream. A model may only
        be overridden when the backend declares modelSelection.
      operationId: sendProjectSessionMessage
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentSessionMessageRequest'
      responses:
        '202':
          description: Message accepted; output arrives on the event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed body or empty message text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The instance is not running or model selection is unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to accept the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/stop:
    post:
      summary: Stop a session's run
      description: >-
        Stops the instance running the session. Because the adapter contract
        exposes only an instance-level stop, this stops the instance's run; the
        target session is marked stopped and the instance's other sessions are
        marked disconnected. The operation is idempotent: a second stop is a
        no-op and concurrent stops call the adapter once.
      operationId: stopProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session stopped (or already stopped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The backend does not declare stop support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to stop the instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/interrupt:
    post:
      summary: Interrupt a session's current turn
      description: >-
        Ends the session's current turn without stopping the instance or
        affecting its other sessions. Idempotent: interrupting a session whose
        turn is not running succeeds and returns the session unchanged.
        Requires the backend to declare interrupt support.
      operationId: interruptProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The session's current turn was interrupted (or was idle).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400':
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The backend does not declare interrupt support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to interrupt the turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/sessions/{sessionId}/events:
    get:
      summary: Subscribe to a session's normalized event stream
      description: >-
        Streams the session's normalized events as Server-Sent Events
        (text/event-stream). Each data payload is the normalized event envelope;
        the sessionId is the platform session id. A slow or stale client is
        disconnected rather than allowed to stall the instance's stream. The
        stream ends when the instance's event stream ends.
      operationId: subscribeProjectSessionEvents
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          description: Platform identifier of the session.
          schema:
            type: string
      responses:
        '200':
          description: A Server-Sent Event stream of normalized events.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE frames with id (sequence), event (normalized type) and
                  data (the JSON event envelope).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The session's instance is not running, or the backend does not
            declare streaming support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the platform_csrf cookie value.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Missing or mismatched CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
      additionalProperties: false
    WorkspaceRoot:
      type: object
      required:
        - id
        - path
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
          description: Canonical absolute directory path of the root.
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    WorkspaceRootList:
      type: object
      required:
        - roots
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceRoot'
      additionalProperties: false
    AddWorkspaceRootRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute path of an existing directory to authorize.
      additionalProperties: false
    Project:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
          description: Stable platform identifier; survives renames and moves.
        name:
          type: string
          description: Current project name (directory basename).
        path:
          type: string
          description: Canonical absolute directory path of the project.
      additionalProperties: false
    ProjectList:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      additionalProperties: false
    RegisterProjectRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: >-
            Absolute path of an existing directory inside an authorized
            workspace root.
      additionalProperties: false
    CreateProjectRequest:
      type: object
      required:
        - parent
        - name
      properties:
        parent:
          type: string
          description: Absolute path of an existing authorized parent directory.
        name:
          type: string
          description: >-
            Project directory name; a single path element with no separators.
      additionalProperties: false
    MoveProjectRequest:
      type: object
      required:
        - path
        - confirmName
      properties:
        path:
          type: string
          description: Authorized destination path for the project directory.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    RenameProjectRequest:
      type: object
      required:
        - name
        - confirmName
      properties:
        name:
          type: string
          description: New project directory name; a single path element.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    DeleteProjectRequest:
      type: object
      required:
        - confirmName
      properties:
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
        permanent:
          type: boolean
          default: false
          description: >-
            Explicit second confirmation required to permanently delete the
            directory when the OS trash is unavailable. It is never implied.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    AgentInstance:
      type: object
      required:
        - id
        - projectId
        - backend
        - directory
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform instance identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        directory:
          type: string
          description: Authorized working directory of the instance.
        status:
          type: string
          enum:
            - starting
            - running
            - stopped
            - failed
        endpoint:
          type: string
          description: Base URL of a server-based backend, when one exists.
        error:
          type: string
          description: Redacted adapter failure text for a failed instance.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentInstanceList:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstance'
      additionalProperties: false
    StartAgentInstanceRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
      additionalProperties: false
    AgentBackendConfig:
      type: object
      required:
        - backend
        - enabled
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        enabled:
          type: boolean
          description: Whether the backend is enabled for the project.
      additionalProperties: false
    AgentBackendConfigList:
      type: object
      required:
        - backends
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackendConfig'
      additionalProperties: false
    SetAgentBackendConfigRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    AgentCapabilities:
      type: object
      description: >-
        A backend's explicit capability declaration. Every field is a required
        boolean so a false capability is visibly false and the workbench can
        hide the corresponding control.
      required:
        - streaming
        - sessionDiscovery
        - sessionContinue
        - stop
        - interrupt
        - modelSelection
        - toolCallEvents
        - toolConfirmation
      properties:
        streaming:
          type: boolean
        sessionDiscovery:
          type: boolean
        sessionContinue:
          type: boolean
        stop:
          type: boolean
        interrupt:
          type: boolean
        modelSelection:
          type: boolean
        toolCallEvents:
          type: boolean
        toolConfirmation:
          type: boolean
      additionalProperties: false
    AgentBackend:
      type: object
      required:
        - backend
        - capabilities
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
      additionalProperties: false
    AgentBackendList:
      type: object
      required:
        - backends
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackend'
      additionalProperties: false
    AgentDiagnosticsReport:
      type: object
      required:
        - diagnostics
      properties:
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackendDiagnostics'
      additionalProperties: false
    AgentBackendDiagnostics:
      type: object
      description: >-
        The startup diagnostics of one backend: the overall status (the worst
        check), the detected CLI version, the tested version, the individual
        checks and the backend's capability declaration. Messages are
        actionable and redacted.
      required:
        - backend
        - status
        - checks
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        status:
          type: string
          description: The worst observed check severity; unknown when the adapter produced no checks.
          enum:
            - ok
            - warning
            - error
            - unknown
        version:
          type: string
          description: The CLI version the probe detected, when parseable.
        testedVersion:
          type: string
          description: The version the adapter was verified against.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/AgentDiagnostic'
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
      additionalProperties: false
    AgentDiagnostic:
      type: object
      description: The result of one pre-flight check.
      required:
        - kind
        - status
        - message
      properties:
        kind:
          type: string
          description: What the check inspected.
          enum:
            - executable
            - version
            - api
            - event_stream
            - adapter
        status:
          type: string
          enum:
            - ok
            - warning
            - error
            - unknown
        message:
          type: string
          description: Actionable, redacted summary for the operator.
        detail:
          type: string
          description: Optional bounded raw check output.
      additionalProperties: false
    AgentSession:
      type: object
      description: >-
        The platform's index entry for one agent-native session. It carries only
        the id mapping the platform owns, never agent-native history.
      required:
        - id
        - projectId
        - backend
        - instanceId
        - nativeSessionId
        - status
        - turn
        - capabilities
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform session identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        instanceId:
          type: string
          description: Durable identifier of the instance running the session.
        nativeSessionId:
          type: string
          description: The agent-native session identifier.
        title:
          type: string
          description: Agent-reported display title, when known.
        status:
          type: string
          enum:
            - active
            - stopped
            - disconnected
          description: >-
            Platform view of the session's run state; derived from the
            instance lifecycle plus an explicit platform stop.
        turn:
          type: string
          enum:
            - idle
            - running
          description: >-
            Whether the session is processing one user turn. Derived from the
            instance's lifecycle events and never persisted, so it is idle
            after a platform restart.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentSessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
      additionalProperties: false
    ModelInfo:
      type: object
      description: >-
        One model a backend offers. The id uses the provider/model form sent in
        SendAgentSessionMessageRequest.model, with an optional #variant suffix.
      required:
        - id
        - name
        - provider
      properties:
        id:
          type: string
          description: Model identifier in provider/model[#variant] form.
        name:
          type: string
          description: Human-readable model name.
        provider:
          type: string
          description: Provider the model belongs to.
        variants:
          type: array
          items:
            type: string
          description: Optional variants accepted in the id's #variant suffix.
      additionalProperties: false
    ModelInfoList:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
      additionalProperties: false
    CreateAgentSessionRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
          description: >-
            Backend to create the session on. The server reuses the project's
            most recently created running instance of this backend, starting
            one when none is running.
        title:
          type: string
          description: Display title for the new session, when supported.
      additionalProperties: false
    SendAgentSessionMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The message body sent to the agent.
        model:
          type: string
          description: >-
            Per-message model override; only honored when the backend declares
            modelSelection.
      additionalProperties: false
