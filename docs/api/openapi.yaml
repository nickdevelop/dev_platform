openapi: 3.1.0
info:
  title: AI Development Platform API
  description: >-
    Single-user local platform for managing AI development projects.
    All API routes are same-origin under /api.
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
      description: Reports service liveness.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/session:
    get:
      summary: Current session
      description: >-
        Reports whether the caller holds a valid session and returns the CSRF
        token to echo in the X-CSRF-Token header on mutating requests. Always
        succeeds, even when unauthenticated.
      operationId: getSession
      responses:
        '200':
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      summary: Log in with the shared password
      description: >-
        Verifies the platform password and issues an expiring, HttpOnly,
        SameSite=Strict session cookie. Repeated failures are throttled per
        client. Requires a valid CSRF token.
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '429':
          description: Too many failed attempts within the throttle window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      summary: Log out
      description: >-
        Invalidates the current session and clears the session cookie.
        Requires an authenticated session and a valid CSRF token.
      operationId: logout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects:
    get:
      summary: List projects
      description: >-
        Returns the registered projects with their current names and canonical
        directory paths.
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Register an existing project directory
      description: >-
        Registers an existing directory under an authorized workspace root. The
        canonical path is stored and the project name is derived from the
        directory basename; the directory itself is never modified.
      operationId: registerProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProjectRequest'
      responses:
        '201':
          description: Project registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: >-
            Malformed body, or the path is not an authorized existing
            directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The directory is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/create:
    post:
      summary: Create a project directory
      description: >-
        Creates a new project directory named name under an authorized parent
        directory and records it. The name must be a single safe path element;
        an existing target is never overwritten.
      operationId: createProject
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, invalid name, or unauthorized parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: The target directory already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/move:
    post:
      summary: Move a project directory
      description: >-
        Moves the project directory to an authorized destination path and
        updates the record. Requires the typed confirmation of the project's
        current name; an existing destination is never overwritten.
      operationId: moveProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to move.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveProjectRequest'
      responses:
        '200':
          description: Project moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, bad id, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The source directory is missing, the destination exists, or the
            destination parent is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/rename:
    post:
      summary: Rename a project directory
      description: >-
        Renames the project directory within its current parent and updates the
        record. Requires the typed confirmation of the project's current name;
        an existing target is never overwritten.
      operationId: renameProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to rename.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '200':
          description: Project renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Malformed body, bad id, invalid name, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The source directory is missing or the target exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/unregister:
    post:
      summary: Unregister a project
      description: >-
        Removes only the platform project record. The directory on disk is never
        touched. This is the non-destructive alternative to delete.
      operationId: unregisterProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to unregister.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Project unregistered.
        '400':
          description: Malformed project id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/delete:
    post:
      summary: Delete a project directory
      description: >-
        Deletes the project directory and its record, preferring the OS trash.
        When the trash is unavailable the request fails with 409 and nothing is
        removed; the caller must re-issue it with permanent=true after an
        explicit confirmation. The typed confirmation of the project's current
        name is always required.
      operationId: deleteProject
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the project to delete.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
      responses:
        '204':
          description: Project directory deleted and record removed.
        '400':
          description: Malformed body, bad id, or mismatched confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The directory is missing, or the OS trash is unavailable and the
            request did not explicitly confirm permanent deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/instances:
    get:
      summary: List a project's agent instances
      description: >-
        Returns the agent instances belonging to the project with their current
        lifecycle status, in creation order.
      operationId: listProjectInstances
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project's agent instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Start a project agent instance
      description: >-
        Starts a new instance of the requested backend in the project's working
        directory. A project may run several instances of the same backend; each
        instance has an independent status and stop operation. A failed start is
        recorded as a failed instance but the request itself returns an error
        and never affects other instances.
      operationId: startProjectInstance
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentInstanceRequest'
      responses:
        '201':
          description: Instance started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstance'
        '400':
          description: Malformed body, unknown backend, or unauthorized project path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The project directory is missing or is not a directory, or the
            backend is disabled for the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to start the instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/instances/{instanceId}/stop:
    post:
      summary: Stop a project agent instance
      description: >-
        Stops the named instance. The operation is idempotent and never affects
        another instance of the same project. The instance must belong to the
        project in the path.
      operationId: stopProjectInstance
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: instanceId
          in: path
          required: true
          description: Durable identifier of the instance to stop.
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Instance stopped (or already stopped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstance'
        '400':
          description: Malformed path or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such instance in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/instances/{instanceId}/git-info:
    get:
      summary: Git state of an instance working directory
      description: >-
        Returns the git state (branch and dirty flag) of the named instance's
        working directory. A directory that is not a git work tree reports
        isGit false rather than an error, so branch display never blocks
        opening a session. The instance must belong to the project in the path.
      operationId: getInstanceGitInfo
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: instanceId
          in: path
          required: true
          description: Durable identifier of the instance.
          schema:
            type: string
      responses:
        '200':
          description: The instance's git state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such instance in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/agent-backends/{backend}/models:
    get:
      summary: List the models a backend offers to a project
      description: >-
        Returns the models the backend offers as seen from the project's
        authorized directory. The catalog belongs to the backend and the
        directory, not to a running instance, so a project with no instance yet
        still offers its models while a session is being created. The platform
        caches the list per backend and directory and refreshes it behind the
        response: updatedAt says when the backend was last asked, and stale says
        the answer is an aged snapshot whose refresh is already running. Set
        refresh to read the backend now. Requires the backend to declare
        modelSelection. The id uses the same provider/model[#variant] form as
        the message model override.
      operationId: listProjectBackendModels
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: backend
          in: path
          required: true
          description: Backend whose catalog is requested.
          schema:
            type: string
            enum:
              - opencode-v2
              - pi
        - name: refresh
          in: query
          required: false
          description: >-
            Set to 1 (or true) to read the backend now instead of accepting the
            cached list. Any other value is ignored.
          schema:
            type: string
      responses:
        '200':
          description: The models the backend offers, and how current they are.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendModelList'
        '400':
          description: The backend id is not a known backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The backend does not declare model selection (unsupported_capability)
            or its machine-level service is not running (service_not_running).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The backend adapter failed to list models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{id}/agent-backends:
    get:
      summary: List a project's backend enable/disable state
      description: >-
        Returns each registered backend with whether it is enabled for the
        project. A backend with no stored configuration is enabled by default.
      operationId: listProjectBackendConfigs
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The project's per-backend enable/disable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendConfigList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{id}/agent-backends/{backend}:
    put:
      summary: Enable or disable a backend for a project
      description: >-
        Upserts the project's enable/disable state for one backend. A disabled
        backend cannot start a new instance in the project; already-running
        instances are unaffected. The pair (project, backend) is unique, so the
        toggle is idempotent.
      operationId: setProjectBackendConfig
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
        - name: backend
          in: path
          required: true
          description: Backend id to configure.
          schema:
            type: string
            enum:
              - opencode-v2
              - pi
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentBackendConfigRequest'
      responses:
        '200':
          description: The updated backend configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendConfig'
        '400':
          description: Malformed body or unknown backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No project with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /agent-backends:
    get:
      summary: List agent backends and their capabilities
      description: >-
        Returns every registered agent backend with the capabilities it
        declares. The workbench uses this to hide controls the backend does not
        support, so unsupported operations are never presented as available.
      operationId: listAgentBackends
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The registered backends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBackendList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /agent-backends/diagnostics:
    get:
      summary: Collect agent backend startup diagnostics
      description: >-
        Runs the pre-flight checks of every registered agent backend:
        executable presence, CLI/API version support against the tested range,
        and (for server backends) API reachability of running instances.
        Messages are actionable and redacted; a backend that fails to report
        is returned as an error report and never prevents the other backends'
        reports.
      operationId: getAgentBackendDiagnostics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: One diagnostics report per registered backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDiagnosticsReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /agent-services/{backend}:
    get:
      summary: Detect a backend's machine-level service
      description: >-
        Observes the machine-wide service a backend type runs — for
        `opencode-v2`, the single `opencode serve --service` registered in
        `service.json` — and reports its state: `stopped`, `running`, or
        `unreachable` with a reason. Detection changes nothing. A backend with
        no machine-level service (such as `pi`) is reported with
        `supported: false` and no start/stop controls.
      operationId: detectAgentService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentBackend'
      responses:
        '200':
          description: The observed service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentServiceStatusResponse'
        '400':
          description: No such backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agent-services/{backend}/start:
    post:
      summary: Start a backend's machine-level service
      description: >-
        Starts the machine-wide service. This is the only path that starts it:
        no session, instance, or other business operation ever launches a
        service on its own. When a service is already serving, nothing is
        started and the platform answers `service_already_running` — it never
        replaces a service that may be serving other clients.
      operationId: startAgentService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentBackend'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentServiceStatusResponse'
        '400':
          description: No such backend, or that backend has no machine-level service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: A service is already serving (`service_already_running`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agent-services/{backend}/stop:
    post:
      summary: Stop a backend's machine-level service
      description: >-
        Stops the machine-wide service at an operator's explicit request,
        whoever started it. The confirmation and its consequences belong to the
        operator: any other client of the same service — including the desktop
        `opencode` app — loses its server, and running sessions are interrupted and
        reported `failed`.
      operationId: stopAgentService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentBackend'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The service is stopped; stopping an already stopped service is also reported here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentServiceStatusResponse'
        '400':
          description: No such backend, or that backend has no machine-level service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
  /projects/{id}/sessions:
    get:
      summary: List a project's indexed sessions
      description: >-
        Returns the project's session index entries, reconciled against the
        current instance lifecycle so a session whose instance has stopped is
        reported disconnected rather than usable.
      operationId: listProjectSessions
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
