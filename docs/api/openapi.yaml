  /secrets:
    post:
      summary: Store an MCP credential value
      description: >-
        Stores a credential value under a fresh opaque reference. The value is
        write-only: it is never returned by any endpoint, and only the opaque
        id is exposed. The value is kept in a separate platform-private file
        with owner-only permissions, which does not protect against same-user
        processes or backups.
      operationId: createSecret
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretWriteRequest'
      responses:
        '201':
          description: Credential stored; only the opaque reference is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretMetadata'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
