      description: Returns every model service with its models (never API key values).
      operationId: listModelServices
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The model services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelServiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a model service
      operationId: createModelService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelServiceInput'
      responses:
        '201':
          description: The created service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
  /model-services/fetch-models:
    post:
      summary: List a service's models
      description: >-
        Calls the OpenAI-compatible /models endpoint using the supplied form
        config (unsaved); nothing is persisted.
      operationId: fetchModelServiceModels
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeInput'
      responses:
        '200':
          description: The candidate models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteModelList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '502':
          description: The model service could not be reached or returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /model-services/{id}:
    put:
      summary: Update a model service
      description: >-
        An empty apiKey clears the stored key; a non-empty one replaces it.
      operationId: updateModelService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelServiceId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelServiceInput'
      responses:
        '200':
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a model service
      description: Deletes the service, its models and its stored API key.
      operationId: deleteModelService
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelServiceId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /model-services/{id}/models:
    post:
      summary: Add a model to a service
      operationId: addModel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelServiceId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInput'
      responses:
        '201':
          description: The created model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The service already defines this model id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{id}:
    put:
      summary: Update a model
      operationId: updateModel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelInput'
      responses:
        '200':
          description: The updated model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a model
      operationId: deleteModel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: No such model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/test:
    post:
      summary: Test a model
      description: Sends a minimal chat completion using the supplied form config; nothing is persisted.
      operationId: testModel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProbeInput'
                - type: object
                  required: [modelId]
                  properties:
                    modelId:
                      type: string
      responses:
        '200':
          description: The test outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '502':
          description: The model service could not be reached or returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
  parameters:
    AgentBackend:
      name: backend
      in: path
      required: true
      description: >-
        Agent backend id as listed by GET /api/agent-backends. The server rejects
        ids the platform catalog does not describe.
      schema:
        type: string
    ModelServiceId:
      name: id
      in: path
      required: true
      description: Model service identifier.
      schema:
        type: integer
        format: int64
    ModelId:
      name: id
      in: path
      required: true
      description: Model identifier.
      schema:
        type: integer
        format: int64
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the platform_csrf cookie value.
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      description: Identifier of the resource.
      schema:
        type: integer
        format: int64
    ProjectId:
      name: id
      in: path
      required: true
      description: Identifier of the owning project.
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Platform identifier of the session.
      schema:
        type: string
    SecretId:
      name: id
      in: path
      required: true
      description: Opaque credential reference.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Missing or mismatched CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
      additionalProperties: false
    Project:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
          description: Stable platform identifier; survives renames and moves.
        name:
          type: string
          description: Current project name (directory basename).
        path:
          type: string
          description: Canonical absolute directory path of the project.
      additionalProperties: false
    ProjectList:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      additionalProperties: false
    RegisterProjectRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: >-
            Absolute path of an existing directory inside an authorized
            workspace root.
      additionalProperties: false
    CreateProjectRequest:
      type: object
      required:
        - parent
        - name
      properties:
        parent:
          type: string
          description: Absolute path of an existing authorized parent directory.
        name:
          type: string
          description: >-
            Project directory name; a single path element with no separators.
      additionalProperties: false
    MoveProjectRequest:
      type: object
      required:
        - path
        - confirmName
      properties:
        path:
          type: string
          description: Authorized destination path for the project directory.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    RenameProjectRequest:
      type: object
      required:
        - name
        - confirmName
      properties:
        name:
          type: string
          description: New project directory name; a single path element.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    DeleteProjectRequest:
      type: object
      required:
        - confirmName
      properties:
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
        permanent:
          type: boolean
          default: false
          description: >-
            Explicit second confirmation required to permanently delete the
            directory when the OS trash is unavailable. It is never implied.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    AgentInstance:
      type: object
      required:
        - id
        - projectId
        - backend
        - directory
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform instance identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        directory:
          type: string
          description: Authorized working directory of the instance.
        status:
          type: string
          enum:
            - starting
            - running
            - stopped
            - failed
        endpoint:
          type: string
          description: Base URL of a server-based backend, when one exists.
        error:
          type: string
          description: Redacted adapter failure text for a failed instance.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentInstanceList:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstance'
      additionalProperties: false
    GitInfo:
      type: object
      description: >-
        Git state of an instance's working directory. isGit false means the
        directory is not a git work tree (or git is unavailable); every other
        field is empty then.
      required:
        - isGit
      properties:
        isGit:
          type: boolean
        branch:
          type: string
          description: Short branch name, or short commit when HEAD is detached.
        dirty:
          type: boolean
          description: True when tracked files have uncommitted changes.
        root:
          type: string
          description: Work-tree top level.
      additionalProperties: false
    StartAgentInstanceRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
      additionalProperties: false
    AgentBackendConfig:
      type: object
      required:
        - backend
        - enabled
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        enabled:
          type: boolean
          description: Whether the backend is enabled for the project.
      additionalProperties: false
    AgentBackendConfigList:
      type: object
      required:
        - backends
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackendConfig'
      additionalProperties: false
    SetAgentBackendConfigRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    AgentCapabilities:
      type: object
      description: >-
        A backend's explicit capability declaration. Every field is a required
        boolean so a false capability is visibly false and the workbench can
        hide the corresponding control.
      required:
        - streaming
        - sessionDiscovery
        - sessionContinue
        - stop
        - interrupt
        - modelSelection
        - toolCallEvents
        - toolConfirmation
        - sessionHistory
        - rawEvents
      properties:
        streaming:
          type: boolean
        sessionDiscovery:
          type: boolean
        sessionContinue:
          type: boolean
        stop:
          type: boolean
          description: >-
            The backend can stop an instance (POST /projects/{id}/instances/{instanceId}/stop).
            Does not gate the session stop endpoint.
        interrupt:
          type: boolean
          description: >-
            The backend can end a session's running turn. Gates both the session
            interrupt and the session stop endpoints.
        modelSelection:
          type: boolean
        toolCallEvents:
          type: boolean
        toolConfirmation:
          type: boolean
        sessionHistory:
          type: boolean
        rawEvents:
          type: boolean
          description: >-
            The backend's untouched event stream can be proxied to the
            workbench. Drives backend-specific views only.
      additionalProperties: false
    AgentBackend:
      type: object
      required:
        - backend
        - capabilities
        - enabled
        - label
        - order
        - serviceSupported
      properties:
        backend:
          type: string
          description: >-
            Backend identifier as the platform catalog names it. The set is not
            enumerated here: clients read the list instead of hard-coding it.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        enabled:
          type: boolean
          description: >-
            Platform-level enablement. A disabled backend cannot be selected for
            new sessions; existing instances and sessions stay usable.
        label:
          type: string
          description: Display name from the catalog; falls back to the backend id.
        order:
          type: integer
          description: Presentation order from the catalog; lower comes first.
        serviceSupported:
          type: boolean
          description: >-
            Whether the backend runs a machine-level service the operator can
            start and stop.
      additionalProperties: false
    AgentServiceStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AgentServiceStatus'
    AgentServiceStatus:
      type: object
      additionalProperties: false
      description: >-
        What the platform observes of a backend's machine-level service. The
        service is a third-party process: the platform adopts it, reports it,
        and starts or stops it only when an operator asks on the platform
        settings page. `detail` carries an actionable, redacted reason whenever
        the service is unreachable.
      required:
        - backend
        - supported
        - state
        - endpoint
        - pid
        - version
        - executable
        - detail
        - checkedAt
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        supported:
          type: boolean
          description: False when the backend has no machine-level service at all.
        state:
          type: string
          enum:
            - stopped
            - running
            - unreachable
        endpoint:
          type: string
          description: Base url of the registered service, when one is registered.
        pid:
          type: integer
          format: int64
          description: Process id the registration names, 0 when nothing is registered.
        version:
          type: string
          description: Service-reported version, when the service answered.
        executable:
          type: string
          description: Path of the executable the platform would use for a start.
        detail:
          type: string
          description: Actionable, redacted reason for an unusable service; empty when there is nothing to say.
        checkedAt:
          type: string
          format: date-time
    AgentBackendList:
      type: object
      required:
        - backends
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackend'
      additionalProperties: false
    AgentDiagnosticsReport:
      type: object
      required:
        - diagnostics
      properties:
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackendDiagnostics'
      additionalProperties: false
    AgentBackendDiagnostics:
      type: object
      description: >-
        The startup diagnostics of one backend: the overall status (the worst
        check), the detected CLI version, the tested version, the individual
        checks and the backend's capability declaration. Messages are
        actionable and redacted.
      required:
        - backend
        - status
        - checks
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        status:
          type: string
          description: The worst observed check severity; unknown when the adapter produced no checks.
          enum:
            - ok
            - warning
            - error
            - unknown
        version:
          type: string
          description: The CLI version the probe detected, when parseable.
        testedVersion:
          type: string
          description: The version the adapter was verified against.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/AgentDiagnostic'
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
      additionalProperties: false
    AgentDiagnostic:
      type: object
      description: The result of one pre-flight check.
      required:
        - kind
        - status
        - message
      properties:
        kind:
          type: string
          description: What the check inspected.
          enum:
            - executable
            - version
            - api
            - event_stream
            - adapter
        status:
          type: string
          enum:
            - ok
            - warning
            - error
            - unknown
        message:
          type: string
          description: Actionable, redacted summary for the operator.
        detail:
          type: string
          description: Optional bounded raw check output.
      additionalProperties: false
    AgentSession:
      type: object
      description: >-
        The platform's index entry for one agent-native session. It carries only
        the id mapping the platform owns, never agent-native history.
      required:
        - id
        - projectId
        - backend
        - instanceId
        - nativeSessionId
        - status
        - turn
        - capabilities
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform session identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        instanceId:
          type: string
          description: Durable identifier of the instance running the session.
        nativeSessionId:
          type: string
          description: The agent-native session identifier.
        title:
          type: string
          description: Agent-reported display title, when known.
        status:
          type: string
          enum:
            - active
            - stopped
            - disconnected
          description: >-
            Platform view of the session's run state; derived from the
            instance lifecycle plus an explicit platform stop.
        turn:
          type: string
          enum:
            - idle
            - running
          description: >-
            Whether the session is processing one user turn. Derived only from
            the session's `turn` events on the live stream (lifecycle names never
            change it) and never persisted, so it is idle after a platform
            restart.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentSessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
      additionalProperties: false
    AgentSessionHistory:
      type: object
      required:
        - events
        - truncated
      properties:
        events:
          type: array
          description: >-
            The session's prior turns, oldest first. Each item is the same
            normalized event envelope the SSE stream delivers (instanceId,
            sessionId, backend, sequence, timestamp, type and exactly one
            typed payload), with replayed=true to mark it as history rather
            than a live event. History carries the transcript only (message,
            tool_call, tool_result, thinking and the like); `turn` and
            `interaction` events are live-only and never appear in it.
          items:
            type: object
        truncated:
          type: boolean
          description: >-
            True when older events exist beyond the returned window, so the
            client can say so instead of presenting a partial history as
            complete.
      additionalProperties: false
    ModelInfo:
      type: object
      description: >-
        One model a backend offers. The id uses the provider/model form sent in
        SendAgentSessionMessageRequest.model, with an optional #variant suffix.
        contextLimit is the model's context window in tokens when the backend
        reports one; absent means unknown and no percentage may be rendered.
      required:
        - id
        - name
        - provider
      properties:
        id:
          type: string
          description: Model identifier in provider/model[#variant] form.
        name:
          type: string
          description: Human-readable model name.
        provider:
          type: string
          description: Provider the model belongs to.
        variants:
          type: array
          items:
            type: string
          description: Optional variants accepted in the id's #variant suffix.
        contextLimit:
          type: integer
          minimum: 1
          description: Context window in tokens, when the backend reports one.
      additionalProperties: false
    BackendModelList:
      type: object
      required:
        - models
        - updatedAt
        - stale
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        updatedAt:
          type: string
          format: date-time
          description: When the backend was last asked for this list.
        stale:
          type: boolean
          description: >-
            True when the answer is a cached snapshot the platform is
            refreshing right now: show these models and expect a newer list.
      additionalProperties: false
    CreateAgentSessionRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
          description: >-
            Backend to create the session on. The server reuses the project's
            most recently created running instance of this backend, starting
            one when none is running.
        title:
          type: string
          description: >-
            Display title for the new session, when supported. An untitled
            create with a message derives the title from that message.
        message:
          type: string
          description: >-
            Optional first message admitted on the created session in the same
            request. A refused message leaves the session live and is reported
            through the response's messageError.
        model:
          type: string
          description: >-
            Model the session is created with (its starting model), only
            honored when the backend declares modelSelection. Independent of
            message: an empty session is still created on this model, and it is
            what the workbench opens the conversation on before the agent's
            first reply. Later messages can still switch models per message.
      additionalProperties: false
    CreateAgentSessionResult:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AgentSession'
        messageError:
          type: string
          description: >-
            Error code of a refused optional first message (the session was
            still created). Absent when the message was admitted or none was
            requested.
      additionalProperties: false
    SendAgentSessionMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The message body sent to the agent.
        model:
          type: string
          description: >-
            Per-message model override; only honored when the backend declares
            modelSelection.
      additionalProperties: false
    PermissionRequest:
      type: object
      required:
        - id
        - sessionId
        - action
      properties:
        id:
          type: string
        sessionId:
          type: string
        action:
          type: string
        resources:
          type: array
          items:
            type: string
        message:
          type: string
      additionalProperties: false
    PermissionRequestList:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionRequest'
      additionalProperties: false
    PermissionRequestReply:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - once
            - always
            - reject
        message:
          type: string
      additionalProperties: false
    FormInfo:
      type: object
      required:
        - id
        - sessionId
        - title
      properties:
        id:
          type: string
        sessionId:
          type: string
        title:
          type: string
        fields:
          type: array
          description: >-
            Opaque field definitions (Form.Field union: string/number/integer/
            boolean/multiselect/external) rendered generically by the workbench.
          items:
            type: object
      additionalProperties: false
    FormInfoList:
      type: object
      required:
        - forms
      properties:
        forms:
          type: array
          items:
            $ref: '#/components/schemas/FormInfo'
      additionalProperties: false
    FormInfoReply:
      type: object
      required:
        - answer
      properties:
        answer:
          type: object
      additionalProperties: false
    ResourceDefinition:
      type: object
      description: >-
        A canonical Skill, MCP or prompt definition. Secret material is never
        present; an MCP definition carries only an opaque secretRef.
      required:
        - id
        - kind
        - name
        - content
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - skill
            - mcp
            - prompt
        name:
          type: string
          description: Human-facing name; a single path segment with no separators.
        description:
          type: string
        content:
          type: string
          description: Definition body (instruction text or backend-neutral definition).
        enabled:
          type: boolean
        promptScope:
          type: string
          enum:
            - project
            - session
          description: Present only for prompt definitions.
        secretRef:
          type: string
          description: >-
            Opaque credential reference for an MCP definition; never the
            credential value.
        backends:
          type: array
          items:
            type: string
          description: Backends the resource applies to; empty means unrestricted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ResourceList:
      type: object
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDefinition'
      additionalProperties: false
    SessionPromptList:
      type: object
      required:
        - prompts
      properties:
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDefinition'
      additionalProperties: false
    ResourceDefinitionRequest:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum:
            - skill
            - mcp
            - prompt
        name:
          type: string
        description:
          type: string
        content:
          type: string
        enabled:
          type: boolean
        promptScope:
          type: string
          enum:
            - project
            - session
        secretRef:
          type: string
          description: Opaque credential reference; never a credential value.
        secretValue:
          type: string
          writeOnly: true
          description: >-
            Plaintext MCP credential to store. It is written to the private
            secret store and never returned; the definition keeps only the
            opaque secretRef.
        backends:
          type: array
          items:
            type: string
      additionalProperties: false
    ResourceReferenceRequest:
      type: object
      required:
        - resourceId
      properties:
        resourceId:
          type: integer
          format: int64
      additionalProperties: false
    SecretWriteRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          writeOnly: true
          description: The credential value to store; never echoed back.
      additionalProperties: false
    SecretMetadata:
      type: object
      required:
        - id
        - present
      properties:
        id:
          type: string
          description: Opaque credential reference.
        present:
          type: boolean
          description: Whether a value is stored under the reference.
      additionalProperties: false
    SyncTarget:
      type: object
      required:
        - projectId
        - path
      properties:
        projectId:
          type: integer
          format: int64
        backendId:
          type: string
          description: Backend the target belongs to; empty for a project-level target.
        path:
          type: string
          description: Target path relative to the project directory.
      additionalProperties: false
    SyncConflict:
      type: object
      required:
        - kind
        - resourceId
        - target
      properties:
        kind:
          type: string
          enum:
            - unmanaged-target
            - external-drift
            - target-invalid
        resourceId:
          type: integer
          format: int64
        target:
          $ref: '#/components/schemas/SyncTarget'
        detail:
          type: string
      additionalProperties: false
    SyncPreview:
      type: object
      required:
        - resourceId
        - kind
        - target
        - state
        - changeSummary
      properties:
        resourceId:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - skill
            - mcp
            - prompt
        target:
          $ref: '#/components/schemas/SyncTarget'
        state:
          type: string
          enum:
            - pending
            - applied
            - conflict
            - failed
            - unsupported
        changeSummary:
          type: string
          description: Human-facing change description; never contains secret material.
        conflict:
          $ref: '#/components/schemas/SyncConflict'
      additionalProperties: false
    SyncPreviewList:
      type: object
      required:
        - previews
      properties:
        previews:
          type: array
          items:
            $ref: '#/components/schemas/SyncPreview'
      additionalProperties: false
    ApplySyncRequest:
      type: object
      properties:
        force:
          type: boolean
          description: >-
            Explicit user resolution that allows overwriting an unmanaged
            target or externally-edited managed content.
      additionalProperties: false
    Appearance:
      type: object
      description: >-
        Shared visual configuration. The type of face is not part of it: the UI
        bundles Google Sans Code (Latin text, digits, code) and Noto Sans SC
        (Chinese) and always uses them.
      required: [theme, fontSize, density]
      properties:
        theme:
          type: string
        fontSize:
          type: integer
        density:
          type: string
      additionalProperties: false
    Agent:
      type: object
      required: [backend, enabled, path, pathSource, available]
      properties:
        backend:
          type: string
        enabled:
          type: boolean
        path:
          type: string
        pathSource:
          type: string
          enum: [auto, manual, none]
        available:
          type: boolean
        mode:
          type: string
          description: >-
            Configured transport for backends with more than one mode (pi:
            cli or rpc); absent means the backend default.
        modes:
          type: array
          items:
            type: string
          description: The transport choices a multi-mode backend offers.
        version:
          type: string
        checkedAt:
          type: string
      additionalProperties: false
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
      additionalProperties: false
    AgentDetection:
      type: object
      required: [backend, status]
      properties:
        backend:
          type: string
        status:
          type: string
          enum: [ok, error]
        path:
          type: string
        version:
          type: string
        error:
          type: string
      additionalProperties: false
    Model:
