        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a session for a backend
      description: >-
        Starts a new agent-native session for the requested backend and records
        the platform-to-native id mapping. The server reuses the project's most
        recently created running instance of that backend, starting one when
        none is running; a start failure leaves no session behind. The removed
        instanceId field is ignored, so a body without backend is rejected.
        An optional first message is admitted on the created session in the
        same request, on the optional model the session is created with (the
        backend must declare modelSelection); the response's messageError
        reports a refused message while the session itself stays live.
      operationId: createProjectSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the owning project.
          schema:
            type: integer
            format: int64
