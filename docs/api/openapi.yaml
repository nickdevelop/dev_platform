        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/{uuid}/subscriptions/{sessionId}:
    delete:
      summary: Unsubscribe a session from the client event bus
      description: Detaches a session from the client event bus.
      operationId: unsubscribeEventBusSession
      security:
        - cookieAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Successfully unsubscribed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{id}/sessions/{sessionId}/commands:
    get:
      summary: List slash commands and skills for the session
      description: >-
        Returns slash commands and skills offered by the session's agent backend.
      operationId: listSessionCommands
