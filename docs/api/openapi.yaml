                      $ref: '#/components/schemas/AgentCommand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such session in this project.
          content:
            application/json:
              schema:
