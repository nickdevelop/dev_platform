          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a task
      description: Deletes one managed task by ID.
      operationId: deleteTask
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/advance:
    post:
      summary: Advance task step
      description: Confirms the current step and advances to the next step.
      operationId: advanceTaskStep
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceStepInput'
      responses:
        '200':
          description: Updated task after step advance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/execution-prompt:
    put:
      summary: Save validated execution prompt
      description: Saves the validated execution plan prompt for a transactional task, advancing it to ready_for_execution state.
      operationId: saveTaskExecutionPrompt
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionPrompt]
              properties:
                executionPrompt:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/runs:
    get:
      summary: List execution runs of a task
      description: Returns the execution history runs for the specified task in reverse chronological order.
      operationId: listTaskRuns
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of execution runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/schedule:
    put:
      summary: Update task schedule configuration
      description: Configures automatic scheduling (once or cron) for a task that is ready for execution.
      operationId: updateTaskSchedule
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleConfigInput'
      responses:
        '200':
          description: Updated task with schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Scheduling not allowed for this flow or not at final confirmed step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/session:
    post:
      summary: Create or get active agent session for task
      description: Creates a new agent session for the task's current step, or returns the existing active session.
      operationId: createTaskSession
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The task and its active session.
          content:
            application/json:
              schema:
                type: object
                required: [task, session]
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  session:
                    $ref: '#/components/schemas/AgentSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}/trigger:
    post:
      summary: Trigger task execution
      description: Triggers execution of the final confirmed step. For transactional tasks, spawns a new independent session.
      operationId: triggerTaskExecution
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the task.
          schema:
            type: integer
            format: int64
        - name: triggerType
          in: query
          required: false
          description: Execution trigger source (manual | once | cron). Defaults to manual.
          schema:
            type: string
            default: manual
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The created execution run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Task already completed or not ready for execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /terminal/status:
    get:
      summary: Get terminal host status
      description: Reports whether the platform host supports local terminal allocation (Linux only).
      tags:
        - Terminal
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Terminal engine status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported:
                    type: boolean
                  os:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /terminal/servers:
    get:
      summary: List terminal servers
      description: Lists all available servers, with localhost at index 0 followed by third-party servers.
      tags:
        - Terminal
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of terminal servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerminalServer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register a new third-party server
      tags:
        - Terminal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - host
                - username
                - auth_type
                - secret
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                username:
                  type: string
                auth_type:
                  type: string
                  enum: [password, key]
                secret:
                  type: string
      responses:
        '201':
          description: Server registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'

  /terminal/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get server details
      tags:
        - Terminal
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Server details.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Server not found.
    put:
      summary: Update a third-party server
      tags:
        - Terminal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - host
                - username
                - auth_type
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                username:
                  type: string
                auth_type:
                  type: string
                  enum: [password, key]
                secret:
                  type: string
      responses:
        '200':
          description: Server updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Server not found.
    delete:
      summary: Delete a third-party server
      tags:
        - Terminal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Server deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Server not found.

  /terminal/servers/test:
    post:
      summary: Test SSH connectivity
      tags:
        - Terminal
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - host
                - username
                - auth_type
              properties:
                host:
                  type: string
                port:
                  type: integer
                username:
                  type: string
                auth_type:
                  type: string
                secret:
                  type: string
                server_id:
                  type: integer
      responses:
        '200':
          description: Connection successful.
        '400':
          description: Connection failed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'

  /terminal/ws/{serverId}:
    parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Interactive terminal WebSocket stream
      description: Upgrades HTTP connection to WebSocket for bidirectional terminal I/O.
      tags:
        - Terminal
      security:
        - cookieAuth: []
      responses:
        '101':
          description: Switching Protocols to WebSocket.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat-groups:
    get:
      summary: List pure-chat groups
      description: Returns all pure-chat groups.
      operationId: listChatGroups
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGroupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a pure-chat group
      operationId: createChatGroup
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatGroupInput'
      responses:
        '201':
          description: The created group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
  /chat-groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Update a pure-chat group
      operationId: updateChatGroup
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatGroupInput'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Group not found.
        '409':
          description: The group is platform-reserved and cannot be renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a pure-chat group and its chats
      operationId: deleteChatGroup
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Group not found.
        '409':
          description: The group is platform-reserved and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chats:
    get:
      summary: List pure-chat conversations
      description: Returns global conversations ordered by most recent activity.
      operationId: listChats
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: groupId
          in: query
          required: false
          description: Restricts the list to one conversation group.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a conversation and send its first message
      operationId: createChat
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateInput'
      responses:
        '201':
          description: The created conversation; the answer streams over SSE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
  /chats/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Read one pure-chat conversation
      operationId: getChat
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Conversation not found.
    put:
      summary: Rename a conversation or change its model
      operationId: updateChat
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdateInput'
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Conversation not found.
        '409':
          description: The conversation cannot be moved into or out of a platform-reserved group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a conversation and its messages
      operationId: deleteChat
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Conversation not found.
  /chats/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Send a message in a conversation
      operationId: sendChatMessage
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSendInput'
      responses:
        '202':
          description: Accepted; the answer streams over SSE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: A generation is already running.
  /chats/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Stop the active generation
      operationId: stopChat
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Generation stopped or already idle.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Conversation not found.
  /chats/{id}/regenerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Regenerate the last assistant answer
      operationId: regenerateChat
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: Accepted; the new answer streams over SSE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          description: A generation is already running.
  /chats/{id}/messages/{messageId}/edit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Edit a user message and resend it
      description: Deletes the edited message and every later message before regenerating.
      operationId: editChatMessage
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatEditInput'
      responses:
        '202':
          description: Accepted; the new answer streams over SSE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          description: Conversation or message not found.
        '409':
          description: A generation is already running.
  /chats/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Stream a conversation as Server-Sent Events
      description: >-
        Sends an initial snapshot, then delta, message_update, conversation,
        turn and closed events. EventSource reconnects with the session cookie.
      operationId: streamChat
      security:
        - cookieAuth: []
      responses:
        '200':
          description: SSE stream of chat events.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Conversation not found.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: platform_session
  parameters:
    AgentBackend:
      name: backend
      in: path
      required: true
      description: >-
        Agent backend id as listed by GET /api/agent-backends. The server rejects
        ids the platform catalog does not describe.
      schema:
        type: string
    ModelServiceId:
      name: id
      in: path
      required: true
      description: Model service identifier.
      schema:
        type: integer
        format: int64
    ModelId:
      name: id
      in: path
      required: true
      description: Model identifier.
      schema:
        type: integer
        format: int64
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the platform_csrf cookie value.
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      description: Identifier of the owning project.
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Platform identifier of the session.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or session expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Missing or mismatched CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
      additionalProperties: false
    Project:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
          description: Stable platform identifier; survives renames and moves.
        name:
          type: string
          description: Current project name (directory basename).
        path:
          type: string
          description: Canonical absolute directory path of the project.
      additionalProperties: false
    TerminalServer:
      type: object
      required:
        - id
        - name
        - host
        - port
        - username
        - auth_type
        - is_local
        - has_secret
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        auth_type:
          type: string
          enum: [local, password, key]
        is_local:
          type: boolean
        has_secret:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    ProjectList:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      additionalProperties: false
    RegisterProjectRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: >-
            Absolute path of an existing directory inside an authorized
            workspace root.
      additionalProperties: false
    CreateProjectRequest:
      type: object
      required:
        - parent
        - name
      properties:
        parent:
          type: string
          description: Absolute path of an existing authorized parent directory.
        name:
          type: string
          description: >-
            Project directory name; a single path element with no separators.
      additionalProperties: false
    MoveProjectRequest:
      type: object
      required:
        - path
        - confirmName
      properties:
        path:
          type: string
          description: Authorized destination path for the project directory.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    RenameProjectRequest:
      type: object
      required:
        - name
        - confirmName
      properties:
        name:
          type: string
          description: New project directory name; a single path element.
        confirmName:
          type: string
          description: >-
            Typed confirmation; must equal the project's current name.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    AgentInstance:
      type: object
      required:
        - id
        - projectId
        - backend
        - directory
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform instance identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        directory:
          type: string
          description: Authorized working directory of the instance.
        status:
          type: string
          enum:
            - starting
            - running
            - stopped
            - failed
        endpoint:
          type: string
          description: Base URL of a server-based backend, when one exists.
        error:
          type: string
          description: Redacted adapter failure text for a failed instance.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentInstanceList:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstance'
      additionalProperties: false
    GitInfo:
      type: object
      description: >-
        Git state of an instance's working directory. isGit false means the
        directory is not a git work tree (or git is unavailable); every other
        field is empty then.
      required:
        - isGit
      properties:
        isGit:
          type: boolean
        branch:
          type: string
          description: Short branch name, or short commit when HEAD is detached.
        dirty:
          type: boolean
          description: True when tracked files have uncommitted changes.
        root:
          type: string
          description: Work-tree top level.
      additionalProperties: false
    StartAgentInstanceRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
      additionalProperties: false
    AgentCapabilities:
      type: object
      description: >-
        A backend's explicit capability declaration. Every field is a required
        boolean so a false capability is visibly false and the workbench can
        hide the corresponding control.
      required:
        - streaming
        - sessionDiscovery
        - sessionContinue
        - stop
        - interrupt
        - modelSelection
        - toolCallEvents
        - toolConfirmation
        - sessionHistory
        - rawEvents
      properties:
        streaming:
          type: boolean
        sessionDiscovery:
          type: boolean
        sessionContinue:
          type: boolean
        stop:
          type: boolean
          description: >-
            The backend can stop an instance (POST /projects/{id}/instances/{instanceId}/stop).
            Does not gate the session stop endpoint.
        interrupt:
          type: boolean
          description: >-
            The backend can end a session's running turn. Gates both the session
            interrupt and the session stop endpoints.
        modelSelection:
          type: boolean
        toolCallEvents:
          type: boolean
        toolConfirmation:
          type: boolean
        sessionHistory:
          type: boolean
        rawEvents:
          type: boolean
          description: >-
            The backend's untouched event stream can be proxied to the
            workbench. Drives backend-specific views only.
      additionalProperties: false
    AgentBackend:
      type: object
      required:
        - backend
        - capabilities
        - enabled
        - label
        - order
        - serviceSupported
      properties:
        backend:
          type: string
          description: >-
            Backend identifier as the platform catalog names it. The set is not
            enumerated here: clients read the list instead of hard-coding it.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        enabled:
          type: boolean
          description: >-
            Platform-level enablement. A disabled backend cannot be selected for
            new sessions; existing instances and sessions stay usable.
        label:
          type: string
          description: Display name from the catalog; falls back to the backend id.
        order:
          type: integer
          description: Presentation order from the catalog; lower comes first.
        serviceSupported:
          type: boolean
          description: >-
            Whether the backend runs a machine-level service the operator can
            start and stop.
        tone:
          type: string
          description: >-
            Optional visual tone preference for backend tags (for example info,
            warning, primary or neutral). Used only when color is absent.
        color:
          type: string
          description: >-
            Optional exact brand colour (#RRGGBB) for backend tags. Takes
            precedence over tone.
        shortName:
          type: string
          description: >-
            Optional short logo identifier (e.g. "OC", "PI", "DS") from the
            backend descriptor.
      additionalProperties: false
    AgentServiceStatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AgentServiceStatus'
    AgentServiceStatus:
      type: object
      additionalProperties: false
      description: >-
        What the platform observes of a backend's machine-level service. The
        service is a third-party process: the platform adopts it, reports it,
        and starts or stops it only when an operator asks on the platform
        settings page. `detail` carries an actionable, redacted reason whenever
        the service is unreachable.
      required:
        - backend
        - supported
        - state
        - endpoint
        - pid
        - version
        - executable
        - detail
        - checkedAt
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        supported:
          type: boolean
          description: False when the backend has no machine-level service at all.
        state:
          type: string
          enum:
            - stopped
            - running
            - unreachable
        endpoint:
          type: string
          description: Base url of the registered service, when one is registered.
        pid:
          type: integer
          format: int64
          description: Process id the registration names, 0 when nothing is registered.
        version:
          type: string
          description: Service-reported version, when the service answered.
        executable:
          type: string
          description: Path of the executable the platform would use for a start.
        detail:
          type: string
          description: Actionable, redacted reason for an unusable service; empty when there is nothing to say.
        checkedAt:
          type: string
          format: date-time
    AgentBackendList:
      type: object
      required:
        - backends
      properties:
        backends:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackend'
      additionalProperties: false
    AgentDiagnosticsReport:
      type: object
      required:
        - diagnostics
      properties:
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AgentBackendDiagnostics'
      additionalProperties: false
    AgentBackendDiagnostics:
      type: object
      description: >-
        The startup diagnostics of one backend: the overall status (the worst
        check), the detected CLI version, the tested version, the individual
        checks and the backend's capability declaration. Messages are
        actionable and redacted.
      required:
        - backend
        - status
        - checks
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        status:
          type: string
          description: The worst observed check severity; unknown when the adapter produced no checks.
          enum:
            - ok
            - warning
            - error
            - unknown
        version:
          type: string
          description: The CLI version the probe detected, when parseable.
        testedVersion:
          type: string
          description: The version the adapter was verified against.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/AgentDiagnostic'
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
      additionalProperties: false
    AgentDiagnostic:
      type: object
      description: The result of one pre-flight check.
      required:
        - kind
        - status
        - message
      properties:
        kind:
          type: string
          description: What the check inspected.
          enum:
            - executable
            - version
            - api
            - event_stream
            - adapter
        status:
          type: string
          enum:
            - ok
            - warning
            - error
            - unknown
        message:
          type: string
          description: Actionable, redacted summary for the operator.
        detail:
          type: string
          description: Optional bounded raw check output.
      additionalProperties: false
    AgentSession:
      type: object
      description: >-
        The platform's index entry for one agent-native session. It carries only
        the id mapping the platform owns, never agent-native history.
      required:
        - id
        - projectId
        - backend
        - instanceId
        - nativeSessionId
        - status
        - turn
        - capabilities
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Durable platform session identifier.
        projectId:
          type: integer
          format: int64
          description: Identifier of the owning project.
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
        instanceId:
          type: string
          description: Durable identifier of the instance running the session.
        nativeSessionId:
          type: string
          description: The agent-native session identifier.
        title:
          type: string
          description: Agent-reported display title, when known.
        status:
          type: string
          enum:
            - active
            - stopped
            - disconnected
          description: >-
            Platform view of the session's run state; derived from the
            instance lifecycle plus an explicit platform stop.
        turn:
          type: string
          enum:
            - idle
            - running
          description: >-
            Whether the session is processing one user turn. Derived only from
            the session's `turn` events on the live stream (lifecycle names never
            change it) and never persisted, so it is idle after a platform
            restart.
        capabilities:
          $ref: '#/components/schemas/AgentCapabilities'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    AgentSessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        total:
          type: integer
          description: Total number of sessions in the project.
      additionalProperties: false
    AgentSessionHistory:
      type: object
      required:
        - events
        - truncated
      properties:
        events:
          type: array
          description: >-
            The session's prior turns, oldest first. Each item is the same
            normalized event envelope the SSE stream delivers (instanceId,
            sessionId, backend, sequence, timestamp, type and exactly one
            typed payload), with replayed=true to mark it as history rather
            than a live event. History carries the transcript only (message,
            tool_call, tool_result, thinking and the like); `turn` and
            `interaction` events are live-only and never appear in it.
          items:
            type: object
        truncated:
          type: boolean
          description: >-
            True when older events exist beyond the returned window, so the
            client can say so instead of presenting a partial history as
            complete.
      additionalProperties: false
    ModelInfo:
      type: object
      description: >-
        One model a backend offers. The id uses the provider/model form sent in
        SendAgentSessionMessageRequest.model, with an optional #variant suffix.
        contextLimit is the model's context window in tokens when the backend
        reports one; absent means unknown and no percentage may be rendered.
      required:
        - id
        - name
        - provider
      properties:
        id:
          type: string
          description: Model identifier in provider/model[#variant] form.
        name:
          type: string
          description: Human-readable model name.
        provider:
          type: string
          description: Provider the model belongs to.
        variants:
          type: array
          items:
            type: string
          description: Optional variants accepted in the id's #variant suffix.
        contextLimit:
          type: integer
          minimum: 1
          description: Context window in tokens, when the backend reports one.
      additionalProperties: false
    AgentModelList:
      type: object
      description: >-
        A platform-wide, persisted snapshot of the models one agent backend
        offers. It is refreshed only by an explicit operator action.
      required:
        - models
        - updatedAt
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the snapshot was last written by a successful refresh. Null
            means the backend has never been refreshed. An empty models array
            with a non-null timestamp means the backend reported no models.
      additionalProperties: false
    CreateAgentSessionRequest:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          enum:
            - opencode-v2
            - pi
          description: >-
            Backend to create the session on. The server reuses the project's
            most recently created running instance of this backend, starting
            one when none is running.
        title:
          type: string
          description: >-
            Display title for the new session, when supported. An untitled
            create with a message derives the title from that message.
        message:
          type: string
          description: >-
            Optional first message admitted on the created session in the same
            request. A refused message leaves the session live and is reported
            through the response's messageError.
        model:
          type: string
          description: >-
            Model the session is created with (its starting model), only
            honored when the backend declares modelSelection. Independent of
            message: an empty session is still created on this model, and it is
            what the workbench opens the conversation on before the agent's
            first reply. Later messages can still switch models per message.
      additionalProperties: false
    CreateAgentSessionResult:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AgentSession'
        messageError:
          type: string
          description: >-
            Error code of a refused optional first message (the session was
            still created). Absent when the message was admitted or none was
            requested.
      additionalProperties: false
    SendAgentSessionMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The message body sent to the agent.
        model:
          type: string
          description: >-
            Per-message model override; only honored when the backend declares
            modelSelection.
      additionalProperties: false
    PermissionRequest:
      type: object
      required:
        - id
        - sessionId
        - action
      properties:
        id:
          type: string
        sessionId:
          type: string
        action:
          type: string
        resources:
          type: array
          items:
            type: string
        message:
          type: string
      additionalProperties: false
    PermissionRequestList:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionRequest'
      additionalProperties: false
    PermissionRequestReply:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - once
            - always
            - reject
        message:
          type: string
      additionalProperties: false
    FormInfo:
      type: object
      required:
        - id
        - sessionId
        - title
      properties:
        id:
          type: string
        sessionId:
          type: string
        title:
          type: string
        fields:
          type: array
          description: >-
            Opaque field definitions (Form.Field union: string/number/integer/
            boolean/multiselect/external) rendered generically by the workbench.
          items:
            type: object
      additionalProperties: false
    FormInfoList:
      type: object
      required:
        - forms
      properties:
        forms:
          type: array
          items:
            $ref: '#/components/schemas/FormInfo'
      additionalProperties: false
    FormInfoReply:
      type: object
      required:
        - answer
      properties:
        answer:
          type: object
      additionalProperties: false
    Appearance:
      type: object
      description: >-
        Shared visual configuration. The type of face is not part of it: the UI
        bundles Google Sans Code (Latin text, digits, code) and Noto Sans SC
        (Chinese) and always uses them.
      required: [theme, fontSize, density]
      properties:
        theme:
          type: string
        fontSize:
          type: integer
        density:
          type: string
      additionalProperties: false
    QuickAssistant:
      type: object
      description: Feature toggle for the floating quick-assistant surface.
      required: [enabled]
      properties:
        enabled:
          type: boolean
      additionalProperties: false
    Agent:
      type: object
      required: [backend, enabled, path, pathSource, available]
      properties:
        backend:
          type: string
        enabled:
          type: boolean
        path:
          type: string
        pathSource:
          type: string
          enum: [auto, manual, none]
        available:
          type: boolean
        mode:
          type: string
          description: >-
            Configured transport for backends with more than one mode (pi:
            cli or rpc); absent means the backend default.
        modes:
          type: array
          items:
            type: string
          description: The transport choices a multi-mode backend offers.
        version:
          type: string
        checkedAt:
          type: string
      additionalProperties: false
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
      additionalProperties: false
    AgentDetection:
      type: object
      required: [backend, status]
      properties:
        backend:
          type: string
        status:
          type: string
          enum: [ok, error]
        path:
          type: string
        version:
          type: string
        error:
          type: string
      additionalProperties: false
    Model:
      type: object
      required: [id, serviceId, modelId, name, supportsText, supportsImage, supportsTools, contextTokens, outputTokens, enabled, usable]
      properties:
        id:
          type: integer
          format: int64
        serviceId:
          type: integer
          format: int64
        modelId:
          type: string
        name:
          type: string
        supportsText:
          type: boolean
        supportsImage:
          type: boolean
        supportsTools:
          type: boolean
        contextTokens:
          type: integer
        outputTokens:
          type: integer
        enabled:
          type: boolean
        usable:
          type: boolean
      additionalProperties: false
    ModelInput:
      type: object
      required: [modelId, name, supportsText, supportsImage, supportsTools, contextTokens, outputTokens, enabled]
      properties:
        modelId:
          type: string
        name:
          type: string
        supportsText:
          type: boolean
        supportsImage:
          type: boolean
        supportsTools:
          type: boolean
        contextTokens:
          type: integer
        outputTokens:
          type: integer
        enabled:
          type: boolean
      additionalProperties: false
    ModelService:
      type: object
      required: [id, name, baseUrl, hasKey, secretRef, enabled, models]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        baseUrl:
          type: string
        hasKey:
          type: boolean
        secretRef:
          type: string
        enabled:
          type: boolean
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      additionalProperties: false
    ModelServiceInput:
      type: object
      required: [name, baseUrl, enabled]
      properties:
        name:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
          description: Write-only. Empty keeps the stored key; a non-empty value replaces it.
        enabled:
          type: boolean
      additionalProperties: false
    ModelServiceList:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ModelService'
      additionalProperties: false
    ProbeInput:
      type: object
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
        apiKey:
          type: string
        secretRef:
          type: string
      additionalProperties: false
    RemoteModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    RemoteModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/RemoteModel'
      additionalProperties: false
    ModelTestResult:
      type: object
      required: [modelId, latencyMs]
      properties:
        modelId:
          type: string
        latencyMs:
          type: integer
          format: int64
      additionalProperties: false
    FileItem:
      type: object
      required: [name, path, isDir]
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean
      additionalProperties: false
    FileTreeNode:
      type: object
      required: [name, path, isDir]
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean
        size:
          type: integer
          format: int64
        children:
          type: array
          items:
            $ref: '#/components/schemas/FileTreeNode'
      additionalProperties: false
    FileContentResponse:
      type: object
      required: [path, size, lines, mimeType, isBinary]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        lines:
          type: integer
        mimeType:
          type: string
        isBinary:
          type: boolean
        content:
          type: string
        truncated:
          type: boolean
      additionalProperties: false
    GitStatusItem:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [modified, added, deleted, untracked, renamed]
      additionalProperties: false
    AgentCommand:
      type: object
      required: [name, description, source]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [command, skill]
      additionalProperties: false
    StepDef:
      type: object
      required: [index, key, name, description, prompt, isFinal]
      properties:
        index:
          type: integer
